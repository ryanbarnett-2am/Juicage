<!DOCTYPE html>
<html>
<body>
<canvas id="c" width="32" height="32"></canvas>
<script>
  // Renders the tray progress ring off-screen; main process pulls the PNG data URL.
  function drawIcon(percent, level, lightTaskbar) {
    const c = document.getElementById('c')
    const ctx = c.getContext('2d')
    ctx.clearRect(0, 0, 32, 32)
    const colors = {
      red: '#d93036',
      orange: '#e08c00',
      normal: lightTaskbar ? '#333333' : '#e8e8e8',
      gray: lightTaskbar ? '#777777' : '#8a8a8a',
    }
    const color = colors[level] || colors.normal
    ctx.lineWidth = 6
    ctx.lineCap = 'round'
    ctx.strokeStyle = lightTaskbar ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.30)'
    ctx.beginPath()
    ctx.arc(16, 16, 12, 0, Math.PI * 2)
    ctx.stroke()
    const frac = Math.max(0, Math.min(100, percent)) / 100
    if (frac > 0.005) {
      ctx.strokeStyle = color
      ctx.beginPath()
      ctx.arc(16, 16, 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac)
      ctx.stroke()
    } else {
      // empty ring still gets a tick so the icon reads as "alive"
      ctx.fillStyle = color
      ctx.beginPath()
      ctx.arc(16, 4, 3, 0, Math.PI * 2)
      ctx.fill()
    }
    return c.toDataURL('image/png')
  }
</script>
</body>
</html>
